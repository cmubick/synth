# XcodeGen project definition. After adding or removing files, regenerate
# the Xcode project with:  cd iOS && xcodegen
name: Synth
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Synth:
    type: application
    platform: iOS
    sources:
      - path: Synth
      - path: ../Engine/include
        group: Engine
      - path: ../Engine/src
        group: Engine
    settings:
      base:
        # Change to your own reverse-domain id before putting it on a device.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.synth
        SWIFT_OBJC_BRIDGING_HEADER: Synth/Synth-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../Engine/include
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Synth
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ENABLE_PREVIEWS: YES
